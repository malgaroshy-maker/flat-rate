services:
  - type: web
    name: labor-estimator
    runtime: docker
    dockerfilePath: backend/Dockerfile.render
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_SOURCE
        value: gemini
      - key: FORCE_LOCAL
        value: "false"
